# Tag Taxonomy - Sapling OS
# Use existing namespaces before inventing new ones.

namespaces:
  date:
    pattern: "date/YYYY-MM-DD"
    required_by: all schemas
    description: ISO date for temporal queries

  raw:
    pattern: "raw"
    used_by: [raw-source]
    description: Source material marker

  source:
    pattern: "source/{type}"
    used_by: [raw-source]
    values: [call, email, github-pr, transcript, web, import]
    extensible: true

  wiki:
    pattern: "wiki"
    used_by: [wiki-page]
    description: Durable business memory marker

  wiki_type:
    pattern: "wiki/{type}"
    used_by: [wiki-page]
    values: [person, company, client, opportunity, engagement, project, offer, commitment, decision, case-study, content, operating-model]
    extensible: true

  ops:
    pattern: "ops"
    used_by: [daily-log, weekly-log, ops-page]
    description: Active operating cockpit marker

  ops_type:
    pattern: "ops/{type}"
    used_by: [ops-page]
    values: [inbox, commitments, pr-queue, review]
    extensible: true

  output:
    pattern: "output"
    used_by: [output]
    description: Durable deliverable marker

  daily:
    pattern: "daily"
    used_by: [daily-log]

  weekly:
    pattern: "weekly"
    used_by: [weekly-log]

  person:
    pattern: "person/{slug}"
    description: Person referenced or represented by a wiki page

  company:
    pattern: "company/{slug}"
    description: Company referenced or represented by a wiki page

  client:
    pattern: "client/{slug}"
    description: Client relationship tag

  project:
    pattern: "project/{slug}"
    description: Product, repo, client project, internal initiative, or engagement workstream

  opportunity:
    pattern: "opportunity/{slug}"
    description: Sales, partnership, hiring, content, or investment opportunity

  offer:
    pattern: "offer/{slug}"
    description: Productized service or business offer

  topic:
    pattern: "topic/{slug}"
    description: Subject matter. Check existing usage before creating new topics.

  status:
    pattern: "status/{status}"
    values: [active, draft, review, final, published, sent, archived, done, blocked, captured, processed]
    extensible: true

  output_type:
    pattern: "output/{type}"
    values: [pr-review, prd, email, proposal, research, strategy-memo, client-update, linkedin-post, script]
    extensible: true
