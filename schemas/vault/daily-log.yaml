# Daily Log Schema - Ops Cockpit
# Location: brain/ops/daily/YYYY-MM-DD.md
# Created by: /today command or startup hook

schema_version: 1.1.0
changelog:
  - version: 1.1.0
    date: 2026-07-01
    changes: Moved daily logs from brain/logs/daily to brain/ops/daily
  - version: 1.0.0
    date: 2025-12-27
    changes: Initial schema definition

name: daily-log
description: Daily operating log for focus, commitments, decisions, and session summaries
location: brain/ops/daily/
filename_pattern: "YYYY-MM-DD.md"
created_by: /today command

frontmatter:
  required:
    schema_version:
      type: string
      format: semver
      description: Schema version used to create this file
      current: 1.1.0

    date:
      type: date
      format: YYYY-MM-DD
      description: The date this log represents

    type:
      type: literal
      value: daily
      description: Always "daily"

    tags:
      type: array
      required_patterns:
        - "date/YYYY-MM-DD"
        - "daily"
        - "ops"

  optional:
    week:
      type: wikilink
      target: ops/weekly/
      description: Link to containing weekly log

    month:
      type: wikilink
      target: ops/monthly/
      description: Link to containing monthly log

    energy:
      type: number
      range: [1, 5]
      description: Energy level rating

    focus_rating:
      type: number
      range: [1, 5]
      description: Focus quality rating

body_sections:
  - name: navigation
    required: true
    description: Links to previous and next day
    format: "<< [[ops/daily/YYYY-MM-DD]] | [[ops/daily/YYYY-MM-DD]] >>"

  - name: focus
    heading: "## Focus"
    required: true
    description: Single most important outcome for today

  - name: commitments
    heading: "## Commitments"
    required: true
    description: Active commitments and handoffs

  - name: work_queue
    heading: "## Work Queue"
    required: true
    description: Links to beads, ops queues, PRs, or active projects

  - name: created_today
    heading: "## Created Today"
    required: true
    description: Dataview query showing files created on this date

  - name: decisions_made
    heading: "## Decisions Made"
    required: false
    description: Links to decision pages or outputs created today

  - name: session_log
    heading: "## Session Log"
    required: false
    description: Hook-managed summary of agent sessions

example: |
  ---
  schema_version: 1.1.0
  date: 2026-07-01
  type: daily
  week: "[[ops/weekly/2026-W27]]"
  month: "[[ops/monthly/2026-07]]"
  tags: [date/2026-07-01, daily, ops]
  ---

  # Wednesday, July 1, 2026

  << [[ops/daily/2026-06-30]] | [[ops/daily/2026-07-02]] >>

  ## Focus

  ## Commitments
  - [ ] Review active commitments in [[ops/commitments]]

  ## Work Queue
  - PRs: [[ops/pr-queue]]
  - Beads: `bd ready`

  ## Created Today
  ```dataview
  LIST FROM #date/2026-07-01 WHERE file.name != this.file.name
  SORT type
  ```

  ## Decisions Made
  *None yet*

  ## Session Log
