# Output Schema - Deliverables Created by Agents or Humans
# Location: brain/outputs/YYYY-MM-DD-{slug}.md or typed subfolders

schema_version: 1.2.0
changelog:
  - version: 1.2.0
    date: 2026-07-01
    changes: Updated references for wiki-centered Sapling structure
  - version: 1.1.0
    date: 2025-12-28
    changes: Added person/{slug} and company/{slug} to optional tag patterns
  - version: 1.0.0
    date: 2025-12-27
    changes: Initial schema definition

name: output
description: Durable deliverable such as a PR review, PRD, client email, strategy memo, proposal, post, or report
location: brain/outputs/
filename_pattern: "YYYY-MM-DD-{slug}.md"
created_by: agent or human

frontmatter:
  required:
    schema_version:
      type: string
      format: semver
      description: Schema version used to create this file
      current: 1.2.0

    date:
      type: date
      format: YYYY-MM-DD
      description: Date created

    type:
      type: string
      description: Output type - extensible, not limited to predefined values
      examples:
        - pr-review
        - prd
        - email
        - proposal
        - research
        - strategy-memo
        - client-update
        - linkedin-post
        - script

    status:
      type: enum
      values: [draft, review, final, published, sent, archived]
      description: Current state of the output

    tags:
      type: array
      required_patterns:
        - "date/YYYY-MM-DD"
        - "output"
        - "output/{type}"
        - "status/{status}"
      optional_patterns:
        - "client/{slug}"
        - "project/{slug}"
        - "topic/{topic}"
        - "person/{slug}"
        - "company/{slug}"

  optional:
    people:
      type: array
      items: wikilink
      target: brain/wiki/people/
      description: People this output is for or about

    companies:
      type: array
      items: wikilink
      target: brain/wiki/companies/
      description: Companies this output is for or about

    projects:
      type: array
      items: wikilink
      target: brain/wiki/projects/
      description: Related projects

    source_refs:
      type: array
      items: wikilink
      target: brain/raw/
      description: Raw sources used to create this output

    task_ref:
      type: string
      description: Bead id or link to originating ops daily item

    published_url:
      type: url
      description: URL where output was published

body_sections:
  - name: content
    heading: "# {Title}"
    required: true
    description: The actual deliverable content

  - name: source_context
    heading: "## Source Context"
    required: false
    description: Raw sources and wiki pages used

  - name: outcome
    heading: "## Outcome"
    required: false
    description: Results after sending, publishing, merging, or reviewing

example: |
  ---
  schema_version: 1.2.0
  date: 2026-07-01
  type: pr-review
  status: review
  people: []
  companies: []
  projects:
    - "[[wiki/projects/example]]"
  source_refs:
    - "[[raw/github/hwells4-example/prs/42]]"
  task_ref: "SAP-123"
  published_url: null
  tags:
    - date/2026-07-01
    - output
    - output/pr-review
    - status/review
    - project/example
  ---

  # hwells4/example PR 42 Review

  ## Source Context
  - Raw PR: [[raw/github/hwells4-example/prs/42]]
  - Project: [[wiki/projects/example]]

  ## Review

  ## Outcome
  - **Result:** pending
