# Weekly Log Schema - Ops Review
# Location: brain/ops/weekly/YYYY-Www.md
# Created by: /weekly command or manually

schema_version: 1.1.0
changelog:
  - version: 1.1.0
    date: 2026-07-01
    changes: Moved weekly reviews from brain/logs/weekly to brain/ops/weekly
  - version: 1.0.0
    date: 2025-12-27
    changes: Initial schema definition

name: weekly-log
description: Weekly operating review, priorities, and open loops
location: brain/ops/weekly/
filename_pattern: "YYYY-Www.md"
created_by: /weekly command

frontmatter:
  required:
    schema_version:
      type: string
      format: semver
      description: Schema version used to create this file
      current: 1.1.0

    date:
      type: date
      format: YYYY-MM-DD
      description: Monday of the week

    type:
      type: literal
      value: weekly
      description: Always "weekly"

    tags:
      type: array
      required_patterns:
        - "date/YYYY-MM-DD"
        - "weekly"
        - "ops"

  optional:
    month:
      type: wikilink
      target: ops/monthly/
      description: Link to containing monthly log

    quarter:
      type: wikilink
      target: ops/quarterly/
      description: Link to containing quarterly log

body_sections:
  - name: week_focus
    heading: "## Week Focus"
    required: true
    description: Primary objective for the week

  - name: daily_links
    heading: "## Daily Links"
    required: true
    description: Links to each day of the week

  - name: commitments
    heading: "## Commitments"
    required: true
    description: Commitments opened, closed, and carried forward

  - name: project_review
    heading: "## Project Review"
    required: true
    description: Active project and PR queue review

  - name: decisions
    heading: "## Decisions"
    required: false
    description: Durable decision pages created or updated this week

  - name: next_week
    heading: "## Next Week"
    required: true
    description: Priority and open loops

example: |
  ---
  schema_version: 1.1.0
  date: 2026-06-29
  type: weekly
  month: "[[ops/monthly/2026-07]]"
  quarter: "[[ops/quarterly/2026-Q3]]"
  tags: [date/2026-06-29, weekly, ops]
  ---

  # Week 27 - June 29-July 5, 2026

  ## Week Focus

  ## Daily Links
  - [[ops/daily/2026-06-29|Monday]]
  - [[ops/daily/2026-06-30|Tuesday]]
  - [[ops/daily/2026-07-01|Wednesday]]
  - [[ops/daily/2026-07-02|Thursday]]
  - [[ops/daily/2026-07-03|Friday]]

  ## Commitments

  ## Project Review
  - PR queue: [[ops/pr-queue]]

  ## Decisions

  ## Next Week
